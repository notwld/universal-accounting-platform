name: finance-postgres
on:
  pull_request:
  push:
    paths:
      - "backend/**"
      - "deploy/postgres/**"
      - ".github/workflows/finance-postgres.yml"
jobs:
  postgres-two-role:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uap
          POSTGRES_PASSWORD: uap
          POSTGRES_DB: uap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uap -d uap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://uap:uap@localhost:5432/uap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt "psycopg[binary]>=3.1"
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Provision uap_app runtime role
        env:
          PGPASSWORD: uap
        run: psql -h localhost -U uap -d uap -f ../deploy/postgres/init.sql
      - name: Migrate as table owner
        run: python manage.py migrate
      - name: Grant runtime role on migrated tables
        env:
          PGPASSWORD: uap
        run: |
          psql -h localhost -U uap -d uap -c "GRANT USAGE ON SCHEMA public TO uap_app;"
          psql -h localhost -U uap -d uap -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO uap_app;"
          psql -h localhost -U uap -d uap -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO uap_app;"
      - name: Test as uap_app
        env:
          DATABASE_URL: postgres://uap_app:uap_app@localhost:5432/uap
        run: python -m pytest apps/finance/tests --tb=short
